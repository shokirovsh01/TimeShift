{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto anim-in">
    <div class="relative overflow-hidden bg-slate-900/70 border border-white/5 rounded-3xl shadow-2xl shadow-black/40 backdrop-blur">
        <!-- декор -->
        <div class="absolute -top-24 -right-16 w-64 h-64 bg-indigo-600/20 blur-3xl rounded-full pointer-events-none" aria-hidden="true"></div>
        <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-indigo-500/70 to-transparent" aria-hidden="true"></div>

        <div class="relative p-6 sm:p-8">
            <div class="flex items-center gap-3 mb-1">
                <span class="bg-indigo-500/15 border border-indigo-500/25 text-indigo-300 w-11 h-11 rounded-2xl flex items-center justify-center text-xl bob">📝</span>
                <div>
                    <h1 class="text-2xl font-bold text-white font-display">Создать задачу</h1>
                    <p class="text-slate-400 text-sm mt-0.5">Опиши помощь и укажи награду в минутах</p>
                </div>
            </div>

            <form method="POST" class="task-form mt-7">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-5 border-t border-white/5">
                    <a href="{% url 'bounty_list' %}"
                       class="btn px-6 py-3 rounded-2xl bg-white/5 text-slate-300 hover:bg-white/10 hover:text-white transition font-medium text-sm border border-white/10 text-center">
                        Отмена
                    </a>
                    <button type="submit"
                            class="btn btn-glow-indigo px-6 py-3 rounded-2xl bg-indigo-500 text-white font-semibold text-sm hover:bg-indigo-400 shadow-lg shadow-indigo-500/25">
                        Опубликовать
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Стилизация полей {{ form.as_p }} через Tailwind (без JS) -->
<style type="text/tailwindcss">
    .task-form p {
        @apply mb-5;
    }
    .task-form label {
        @apply block text-sm font-semibold text-slate-300 mb-2;
    }
    .task-form input:not([type="checkbox"]):not([type="file"]),
    .task-form textarea,
    .task-form select {
        @apply w-full bg-slate-950/80 border border-white/10 rounded-2xl px-4 py-3 text-white placeholder-slate-500
               focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30
               transition-all duration-200 hover:border-white/20;
    }
    .task-form input[type="number"] {
        @apply max-w-[180px];
    }
    .task-form textarea {
        @apply min-h-32 resize-y;
    }
    .task-form select[multiple] {
        @apply h-32;
    }
    .task-form select option {
        @apply bg-slate-900 text-slate-200;
    }
    .task-form ul.errorlist {
        @apply text-xs text-rose-400 mb-2 list-none p-0;
    }
    .task-form .helptext {
        @apply block text-xs text-slate-500 mt-1.5;
    }
</style>
{% endblock %}
