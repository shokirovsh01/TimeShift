{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
    <h1 class="text-2xl font-bold text-white mb-6">Регистрация в DevTime</h1>

    <form method="POST" class="space-y-4">
        {% csrf_token %}
        {{ form.non_field_errors }}
        
        {% for field in form %}
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <span class="text-xs text-rose-400">{{ field.errors.0 }}</span>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="w-full mt-2 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition shadow-lg shadow-indigo-600/25">
            Зарегистрироваться
        </button>
    </form>
    
    <p class="text-slate-400 text-xs text-center mt-6">
        Уже есть аккаунт? <a href="{% url 'login' %}" class="text-indigo-400 hover:underline">Войти</a>
    </p>
</div>
{% endblock %}
