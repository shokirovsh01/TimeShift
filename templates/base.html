<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTime — Платформа цифрового бартера</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- Стильный Навбар -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="{% url 'bounty_list' %}" class="flex items-center gap-2.5 group">
                <span class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-500/30 group-hover:bg-indigo-500 transition">⚡</span>
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">
                    DevTime
                </span>
            </a>

            <div class="flex items-center gap-4">
                {% if user.is_authenticated %}
                    <div class="flex items-center gap-3 bg-slate-900/90 px-4 py-2 rounded-xl border border-slate-800 shadow-inner text-sm">
                        <div class="flex items-center gap-1.5">
                            <span class="text-emerald-400 font-semibold">⏳ {{ user.profile.time_balance }} ч.</span>
                        </div>
                        <span class="text-slate-700">|</span>
                        <div class="flex items-center gap-1.5">
                            <span class="text-amber-400 font-semibold">⭐ {{ user.profile.reputation }}</span>
                        </div>
                    </div>
                   <a href="{% url 'profile' %}" class="text-slate-300 hover:text-indigo-400 text-sm font-medium transition">
    {{ user.username }}
</a>
                {% else %}
                    <a href="/admin/" class="text-sm bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl font-medium transition shadow-lg shadow-indigo-600/20">
                        Войти в панель
                    </a>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Основной контейнер -->
    <main class="max-w-6xl mx-auto px-6 py-10 flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Футер -->
    <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
        DevTime &copy; 2026 — Платформа умного обмена знаниями и временем
    </footer>

</body>
</html>
