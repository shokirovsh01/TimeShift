{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto anim-in">
    <div class="relative overflow-hidden bg-[#111726]/60 backdrop-blur-md border border-white/10 rounded-2xl p-6 sm:p-7 shadow-[0_20px_60px_-30px_rgba(0,0,0,0.8)]">
        <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-emerald-500/60 to-transparent" aria-hidden="true"></div>

        <div class="text-center mb-6">
            <span class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-500/25 to-teal-500/10 border border-emerald-500/30 text-emerald-300 text-xl mb-4 shadow-[0_0_22px_-8px_rgba(16,185,129,0.8)]">⚡</span>
            <h1 class="text-xl font-semibold text-white tracking-tight">Вход в систему</h1>
            <p class="text-slate-500 text-sm mt-1">С возвращением в TimeShift</p>
        </div>

        <form method="POST" class="auth-form space-y-4">
            {% csrf_token %}
            {{ form.non_field_errors }}

            {% for field in form %}
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <span class="text-xs text-rose-400 mt-1 block">{{ field.errors.0 }}</span>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn w-full mt-2 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-[#06151B] font-semibold text-sm shadow-[0_0_20px_rgba(16,185,129,0.35)] active:scale-95">
                Войти
            </button>
        </form>

        <p class="text-slate-500 text-xs text-center mt-6">
            Нет аккаунта? <a href="{% url 'register' %}" class="text-emerald-400 hover:text-emerald-300 font-medium transition">Зарегистрироваться</a>
        </p>
    </div>
</div>

<style type="text/tailwindcss">
    .auth-form input[type="text"],
    .auth-form input[type="password"] {
        @apply w-full bg-[#0B0F19]/80 border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600
               focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20
               transition-all duration-300 hover:border-white/20;
    }
    .auth-form ul.errorlist {
        @apply text-xs text-rose-400 mb-2 list-none p-0;
    }
</style>
{% endblock %}
