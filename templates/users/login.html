{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto anim-in">
    <div class="relative overflow-hidden bg-slate-900/70 border border-white/5 rounded-3xl p-7 sm:p-9 shadow-2xl shadow-black/40 backdrop-blur">
        <div class="absolute -top-24 -right-16 w-56 h-56 bg-indigo-600/20 blur-3xl rounded-full pointer-events-none" aria-hidden="true"></div>
        <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-indigo-500/70 to-transparent" aria-hidden="true"></div>

        <div class="relative text-center mb-7">
            <span class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-500 to-violet-600 text-2xl shadow-lg shadow-indigo-500/30 mb-4 bob">⚡</span>
            <h1 class="text-2xl font-bold text-white font-display">Вход в систему</h1>
            <p class="text-slate-400 text-sm mt-1">С возвращением в TimeShift</p>
        </div>

        <form method="POST" class="auth-form space-y-4 relative">
            {% csrf_token %}
            {{ form.non_field_errors }}

            {% for field in form %}
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1.5">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <span class="text-xs text-rose-400 mt-1 block">{{ field.errors.0 }}</span>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="btn btn-glow-indigo w-full mt-2 py-3.5 rounded-2xl bg-indigo-500 hover:bg-indigo-400 text-white font-semibold transition shadow-lg shadow-indigo-500/25">
                Войти
            </button>
        </form>

        <p class="text-slate-400 text-xs text-center mt-7 relative">
            Нет аккаунта? <a href="{% url 'register' %}" class="text-indigo-400 hover:text-indigo-300 font-semibold transition">Зарегистрироваться</a>
        </p>
    </div>
</div>

<style type="text/tailwindcss">
    .auth-form input[type="text"],
    .auth-form input[type="password"] {
        @apply w-full bg-slate-950/80 border border-white/10 rounded-2xl px-4 py-3 text-white placeholder-slate-500
               focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30
               transition-all duration-200 hover:border-white/20;
    }
    .auth-form ul.errorlist {
        @apply text-xs text-rose-400 mb-2 list-none p-0;
    }
</style>
{% endblock %}
