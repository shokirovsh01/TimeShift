{% extends 'base.html' %}

{% block content %}
<div class="max-w-xl mx-auto anim-in">
    <div class="relative overflow-hidden bg-[#111726]/60 backdrop-blur-md border border-white/10 rounded-2xl shadow-[0_20px_60px_-30px_rgba(0,0,0,0.8)]">
        <!-- неоновая линия сверху -->
        <div class="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-emerald-500/60 to-transparent" aria-hidden="true"></div>

        <div class="p-6 sm:p-7">
            <div class="flex items-center gap-3 mb-6">
                <span class="bg-gradient-to-br from-emerald-500/20 to-teal-500/10 border border-emerald-500/30 text-emerald-300 w-10 h-10 rounded-xl flex items-center justify-center text-lg shadow-[0_0_18px_-8px_rgba(16,185,129,0.7)]">📝</span>
                <div>
                    <h1 class="text-xl font-semibold text-white tracking-tight">Создать задачу</h1>
                    <p class="text-slate-500 text-sm mt-0.5">Опиши помощь и укажи награду в минутах</p>
                </div>
            </div>

            <form method="POST" class="task-form">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="flex flex-col-reverse sm:flex-row justify-end gap-3 pt-5 border-t border-white/5 mt-1">
                    <a href="{% url 'bounty_list' %}"
                       class="btn px-5 py-2.5 rounded-xl bg-white/5 text-slate-300 hover:bg-white/10 hover:text-white transition font-medium text-sm border border-white/10 text-center">
                        Отмена
                    </a>
                    <button type="submit"
                            class="btn px-5 py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-400 text-[#06151B] font-semibold text-sm hover:from-emerald-400 hover:to-teal-300 shadow-[0_0_20px_rgba(16,185,129,0.35)] active:scale-95">
                        Опубликовать
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Стилизация полей {{ form.as_p }} через Tailwind (без JS) -->
<style type="text/tailwindcss">
    .task-form p {
        @apply mb-4;
    }
    .task-form label {
        @apply block text-sm font-medium text-slate-300 mb-1.5;
    }
    .task-form input:not([type="checkbox"]):not([type="file"]),
    .task-form textarea,
    .task-form select {
        @apply w-full bg-[#0B0F19]/80 border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-600
               focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20
               transition-all duration-300 hover:border-white/20;
    }
    .task-form input[type="number"] {
        @apply max-w-[180px] font-mono;
    }
    .task-form textarea {
        @apply min-h-32 resize-y;
    }
    .task-form select[multiple] {
        @apply h-32;
    }
    .task-form select option {
        @apply bg-[#111726] text-slate-200;
    }
    .task-form ul.errorlist {
        @apply text-xs text-rose-400 mb-2 list-none p-0;
    }
    .task-form .helptext {
        @apply block text-xs text-slate-500 mt-1.5;
    }
</style>
{% endblock %}
